; PlatformIO Configuration for Motor Control Inverter (ESP32)
; Project: Universal PMSM/BLDC Controller
; Target: ESP32-WROOM-32E
; Framework: Arduino + PlatformIO
; Libraries: SimpleFOC + FreeRTOS

[platformio]
default_envs = esp32-dev
src_dir = src
include_dir = include
lib_dir = lib
data_dir = data

[env:esp32-dev]
platform = espressif32 @ ^6.0.0
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_port = /dev/ttyUSB0          ; Adjust for your system (COM3 on Windows)
upload_speed = 921600

; Board-specific settings
board_build.mcu = esp32
board_build.f_cpu = 240000000L
board_build.f_flash = 40000000L
board_build.flash_mode = dio

; Partition scheme for OTA updates (optional)
board_build.partitions = default.csv

; Compiler flags for optimization
build_flags = 
    -Wall
    -Wextra
    -O2
    -DCORE_DEBUG_LEVEL=0
    -DCONFIG_FREERTOS_HZ=1000
    -DCORE_DEBUG_LEVEL=0

; Library dependencies
lib_deps = 
    ESP32 BLE Arduino

; Serial monitor settings
monitor_filters = 
    esp32_exception_decoder
    time_unix
    send_on_enter

; Advanced settings
lib_ldf_mode = deep

[env:esp32-release]
extends = esp32-dev
build_flags = 
    -Wall
    -O3
    -DRELEASE_BUILD
    -DCONFIG_FREERTOS_HZ=1000
    -DARDUINO_LOG_LEVEL=0

; Optional: Debugging configuration
[env:esp32-debug]
extends = esp32-dev
build_flags = 
    -O0
    -g3
    -ggdb3
    -DDEBUG_BUILD
    -DARDUINO_LOG_LEVEL=5

debug_tool = esp-prog
debug_init_break = thb setup

; Testing environment (unit tests)
[env:test]
platform = native
test_framework = googletest
test_dir = tests
